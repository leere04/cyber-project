<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALARM FLIGHT · 보안 관제</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0; padding: 32px;
        background: #0f172a; color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    main { max-width: 1400px; margin: auto; }
    h1 { margin-bottom: 10px; }
    a { color: #93c5fd; }
    .muted { color: #94a3b8; line-height: 1.7; }
    .stats {
        display: grid; grid-template-columns: repeat(5, 1fr);
        gap: 12px; margin: 24px 0;
    }
    .card {
        padding: 20px; background: #1e293b;
        border: 1px solid #334155; border-radius: 12px;
    }
    .card span { display: block; color: #94a3b8; }
    .card strong { display: block; margin-top: 12px; font-size: 30px; }
    .toolbar {
        display: flex; flex-wrap: wrap; gap: 16px;
        align-items: center; margin-bottom: 16px;
    }
    button, select {
        padding: 10px 14px; border-radius: 8px;
        border: 1px solid #475569; background: #1e293b;
        color: white; font: inherit;
    }
    button { background: #2563eb; cursor: pointer; }
    button:disabled { opacity: .5; }
    .table-wrap {
        overflow-x: auto; border: 1px solid #334155;
        border-radius: 12px;
    }
    table {
        width: 100%; min-width: 1050px;
        border-collapse: collapse; background: #1e293b;
    }
    th, td {
        padding: 14px; text-align: left; vertical-align: top;
        border-bottom: 1px solid #334155;
        font-size: 14px; line-height: 1.7;
    }
    th { color: #94a3b8; background: #172033; }
    .CONFIRMED { color: #4ade80; }
    .CAPTCHA_REQUIRED { color: #fbbf24; }
    .BLOCKED { color: #f87171; }
    .CANCELLED { color: #94a3b8; }
    .reason { margin-bottom: 8px; overflow-wrap: anywhere; }
    #message { min-height: 24px; }
    @media(max-width: 800px) {
        body { padding: 20px 12px; }
        .stats { grid-template-columns: repeat(2, 1fr); }
    }
</style>
</head>
<body>
<main>
    <p style="color:#60a5fa;font-weight:bold">ALARM FLIGHT</p>
    <h1>예약 보안 관제</h1>
    <a href="/app">항공권 검색 화면으로</a>

    <p class="muted">
        최신 예약 최대 100건의 현재 상태를 표시합니다.
        아래 집계는 탐지 정확도나 전체 누적 공격 건수가 아닙니다.
    </p>

    <section class="stats">
        <div class="card"><span>조회된 예약</span><strong id="total">—</strong></div>
        <div class="card"><span>예약 완료</span><strong id="confirmed">—</strong></div>
        <div class="card"><span>추가 확인 대기</span><strong id="waiting">—</strong></div>
        <div class="card"><span>예약 차단</span><strong id="blocked">—</strong></div>
        <div class="card"><span>예약 취소</span><strong id="cancelled">—</strong></div>
    </section>

    <div class="toolbar">
        <label>
            상태
            <select id="filter">
                <option value="">전체</option>
                <option value="CONFIRMED">예약 완료</option>
                <option value="CAPTCHA_REQUIRED">추가 확인 대기</option>
                <option value="BLOCKED">예약 차단</option>
                <option value="CANCELLED">예약 취소</option>
            </select>
        </label>
        <button id="refresh" type="button">새로고침</button>
        <label>
            <input id="auto" type="checkbox" checked>
            5초마다 갱신
        </label>
    </div>

    <p id="message" role="status" aria-live="polite"></p>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>예약 / 회원</th>
                    <th>요청 시각</th>
                    <th>항공편 ID</th>
                    <th>IP</th>
                    <th>현재 상태</th>
                    <th>규칙 점수</th>
                    <th>AI 점수</th>
                    <th>위험 점수</th>
                    <th>탐지 사유</th>
                </tr>
            </thead>
            <tbody id="rows"></tbody>
        </table>
    </div>

    <p class="muted">
        AI 점수가 없으면 ‘미산출’로 표시합니다.
        탐지 사유는 규칙에 해당한 근거이며 실제 악성 사용자임을 확정하지 않습니다.
    </p>
</main>

<script>
    const $ = id => document.getElementById(id);
    let records = [];
    let busy = false;
    let updatedAt = null;

    const names = {
        CONFIRMED: "예약 완료",
        CAPTCHA_REQUIRED: "추가 확인 대기",
        BLOCKED: "예약 차단",
        CANCELLED: "예약 취소"
    };

    function cell(text, className = "") {
        const td = document.createElement("td");
        td.textContent = text;
        td.className = className;
        return td;
    }

    function score(value) {
        return value === null || value === undefined
            ? "미산출" : String(value);
    }

    function render() {
        const count = status =>
            records.filter(item => item.status === status).length;

        $("total").textContent = records.length;
        $("confirmed").textContent = count("CONFIRMED");
        $("waiting").textContent = count("CAPTCHA_REQUIRED");
        $("blocked").textContent = count("BLOCKED");
        $("cancelled").textContent = count("CANCELLED");

        const visible = records
            .filter(item => !$("filter").value ||
                item.status === $("filter").value)
            .sort((a, b) => b.id - a.id);

        $("rows").replaceChildren();

        if (!visible.length) {
            const row = document.createElement("tr");
            const empty = cell("표시할 예약 내역이 없습니다.");
            empty.colSpan = 9;
            row.append(empty);
            $("rows").append(row);
            return;
        }

        for (const item of visible) {
            const row = document.createElement("tr");
            const reasons = cell("");
            const list = Array.isArray(item.reasons) ? item.reasons : [];

            if (!list.length) {
                reasons.textContent = "기록된 탐지 사유 없음";
            }

            for (const reason of list) {
                const line = document.createElement("div");
                line.className = "reason";
                line.textContent = reason;
                reasons.append(line);
            }

            row.append(
                cell(`예약 #${item.id} / 회원 #${item.user_id}`),
                cell(String(item.created_at || "").replace("T", " ").slice(0, 19)),
                cell(item.flight_id),
                cell(item.request_ip || "—"),
                cell(names[item.status] || item.status, item.status),
                cell(score(item.rule_score)),
                cell(score(item.ai_score)),
                cell(score(item.risk_score)),
                reasons
            );

            $("rows").append(row);
        }
    }

    async function load() {
        if (busy) return;
        busy = true;
        $("refresh").disabled = true;

        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 10000);

        try {
            const response = await fetch("/reservations?limit=100", {
                cache: "no-store",
                signal: controller.signal
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const data = await response.json();

            if (!Array.isArray(data)) {
                throw new Error("예약 목록 형식이 올바르지 않습니다.");
            }

            records = data;
            render();
            updatedAt = new Date().toLocaleTimeString("ko-KR");

            $("message").textContent =
                `마지막 갱신: ${updatedAt} · ${records.length}건 조회`;
            $("message").style.color = "#94a3b8";

        } catch (error) {
            const detail = error.name === "AbortError"
                ? "서버 응답 시간 초과" : error.message;

            $("message").textContent =
                `조회 실패: ${detail}. ` +
                (updatedAt ? `표는 ${updatedAt} 기준 이전 정보입니다.` : "");
            $("message").style.color = "#f87171";

        } finally {
            clearTimeout(timer);
            busy = false;
            $("refresh").disabled = false;
        }
    }

    $("filter").addEventListener("change", render);
    $("refresh").addEventListener("click", load);

    setInterval(() => {
        if ($("auto").checked && !document.hidden) load();
    }, 5000);

    load();
</script>
</body>
</html>
